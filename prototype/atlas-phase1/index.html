  function render(){document.querySelectorAll('.nav button').forEach(b=>b.removeAttribute('aria-current'));const n=document.getElementById('nav-'+state.view);if(n)n.setAttribute('aria-current','page');document.getElementById('mode-btn').setAttribute('aria-pressed',String(state.returning));document.getElementById('mode-btn').textContent=`Returning preview: ${state.returning?'on':'off'}`;
    if(state.view==='home')main.innerHTML=home();else if(state.view==='estate')main.innerHTML=estate();else if(state.view==='evidence')main.innerHTML=evidencePage();else main.innerHTML=coffeePage(); }
  function home(){return `<section class="home-grid" aria-labelledby="home-heading"><div class="intro"><span class="eyebrow">INDIAN SPECIALTY COFFEE · INDEPENDENTLY UNDERSTOOD</span><h1 id="home-heading">${state.returning?'Pick up where you left off.':'A coffee can take you places.'}</h1><p class="muted">${state.returning?'An illustrative returning-visitor state. A real version would use only your saved preferences and browsing choices.':'Follow the connections between coffees, estates, roasters and what real people thought of their cups.'}</p><div class="paths"><span class="eyebrow">${state.returning?'YOUR NEXT MOVE':'HOW WOULD YOU LIKE TO BEGIN?'}</span><button class="path-choice" data-action="search"><span><span class="serif">I know what I want</span><small>Go straight to process, roast, roaster or reviews</small></span><span class="arrow">↗</span></button><button class="path-choice" data-action="guide"><span><span class="serif">Help me discover</span><small>Optional preferences, never a compulsory quiz</small></span><span class="arrow">↗</span></button><button class="path-choice" data-view="coffee" data-coffee="baarbara"><span><span class="serif">Follow a coffee thread</span><small>Open a real catalogue coffee, by choice</small></span><span class="arrow">↗</span></button></div></div>
    <div class="atlas-stage" aria-label="Illustration: a coffee at the centre of a network of relationships"><div class="orbit"></div><div class="orbit o2"></div><div class="orbit o3"></div><div class="axis"></div><div class="axis b"></div><div class="stage-label l1"><em>01 / COFFEE</em>A distinct roast</div><div class="stage-label l2"><em>02 / PLACE</em>An estate or region</div><div class="stage-label l3"><em>03 / EVIDENCE</em>Independent reviews</div><div class="core-art"><div class="sheet"></div><div class="sheet two"></div><div class="bean"></div></div><div class="home-stage-caption">Start anywhere. Keep your bearings.</div></div>
    <aside class="insight"><span class="eyebrow sea">WHY ICB EXISTS</span><h3 class="serif" style="margin:16px 0">The story is interesting.<br>The evidence matters.</h3><p class="muted">Coffee labels describe what a roaster says. Community ratings tell you what drinkers experienced. We keep those voices distinct.</p><div class="rule"></div><div class="big-number">1,714</div><p class="subtle">active catalogue coffees · snapshot on 9 November 2026</p><div class="rule"></div><div class="entity-note">Only 147 have an independent review.</div><p class="subtle">Sparse evidence is a reason to invite contributions, not invent certainty.</p>${link('Explore coffee with reviews','coffee','mogra')}</aside></section>`;}
  function breadcrumb(items){return `<div class="breadcrumb"><button data-view="home">Atlas</button>${items.map(x=>`<span class="sep">/</span>${x.view?`<button data-view="${x.view}" ${x.coffee?`data-coffee="${x.coffee}"`:''}>${esc(x.label)}</button>`:`<span>${esc(x.label)}</span>`}`).join('')}</div>`;}
  function pack(c){return `<div class="showcase" aria-label="Stylized product silhouette, not an official package photograph"><div class="coffee-pack ${c.art==='original'?'':c.art}"><span class="pack-top">${esc(c.roaster.split(' ')[0].toUpperCase())}</span><span class="pack-line">Specialty coffee</span><span class="pack-bottom">${esc(c.name.length>24?c.name.slice(0,23)+'…':c.name)}</span><span style="font-size:9px;letter-spacing:.11em">INDIA · COFFEE</span></div><div class="showcase-label left"><small>ORIGIN CONTEXT</small>${esc(c.estate)}</div><div class="showcase-label right"><small>ROASTER</small>${esc(c.roaster)}</div></div>`;}
  function review(c){return `<aside class="evidence" aria-label="Independent review evidence"><span class="eyebrow sea">INDEPENDENT COMMUNITY EVIDENCE</span>${c.count?`<h3>What drinkers rated</h3><div class="rating-display">${Number(c.rating).toFixed(1)} <small>/ 5</small></div><p class="count">${c.count} current ${c.count===1?'rating':'ratings'} · snapshot on 9 November 2026</p><p class="note">${c.count<5?'Small sample. Treat this as early feedback, not a definitive verdict.':'This is a community average, not a verified taste guarantee.'}</p>`:`<h3>No independent ratings. Yet.</h3><p class="quote">The catalogue knows this coffee.<br>We still need your experience.</p><p class="note">Zero current ratings in our 9 November snapshot. No invented score, no roaster notes disguised as reviews.</p>`}<div class="divider"></div><p class="note"><strong style="color:var(--paper)">Tried this coffee?</strong><br>Rate it in seconds. Add tasting context only if you want to.</p><button class="primary small-btn" data-action="review">Rate after trying <span>↗</span></button><p class="subtle" style="margin-top:15px">Prototype only: the rating flow does not publish or save anything.</p></aside>`;}
  function coffeePage(){const c=coffees[state.coffee];return `${breadcrumb([{label:c.roaster},{label:c.name}])}<section class="detail-grid" aria-labelledby="coffee-heading"><div class="detail-copy"><span class="eyebrow">A COFFEE, IN CONTEXT</span><h1 id="coffee-heading">${esc(c.name)}.</h1><p class="muted">Roasted by <strong style="color:var(--paper)">${esc(c.roaster)}</strong>. Explore where it came from, how it was described, and what the independent community actually recorded.</p><div class="meta"><strong>PROCESS</strong> &nbsp; ${esc(c.process)}<br><strong>ROAST</strong> &nbsp; ${esc(c.roast)}<br><strong>ORIGIN</strong> &nbsp; ${esc(c.estate)}</div><div class="attention"><strong>Source distinction:</strong> ${esc(c.source)}.</div><div class="buttons"><a class="primary small-btn" href="${pathFor(c)}" target="_blank" rel="noopener noreferrer">View real ICB listing ↗</a><button class="secondary" data-action="search">Explore other coffees</button></div></div>${pack(c)}${review(c)}</section><section class="connections"><span class="eyebrow">THE RELATIONSHIPS · EXPLICIT AND GROUNDED</span><h2>Take a meaningful next step.</h2><div class="relation-grid">${c.estate==='Baarbara Estate'?`<button class="relation" data-view="estate"><span class="type">FACTUAL ORIGIN THREAD</span><span class="name">Baarbara Estate ↗</span><span class="provenance">Explore catalogue-linked interpretations · estate relationship</span></button>`:`<button class="relation" data-view="evidence"><span class="type">COMMUNITY EVIDENCE</span><span class="name">How much can we trust a score? ↗</span><span class="provenance">Sample sizes and evidence coverage · ICB methodology</span></button>`}<button class="relation" data-view="coffee" data-coffee="${state.coffee==='mogra'?'amaltas':'mogra'}"><span class="type">DIFFERENT COFFEE · INDEPENDENT SCORES</span><span class="name">${state.coffee==='mogra'?'Amaltas Blend':'Grey Soul · Mogra'} ↗</span><span class="provenance">A separate catalogue entry, not a claimed flavour match</span></button><button class="relation" data-view="evidence"><span class="type">HOW EVIDENCE WORKS</span><span class="name">Ratings are not facts about taste ↗</span><span class="provenance">See rating counts, coverage, and limitations</span></button></div></section>`;}
  function estate(){return `${breadcrumb([{label:'Naturals',view:'coffee',coffee:'baarbara'},{label:'Baarbara Estate'}])}<div class="estate-grid"><div><span class="eyebrow">PLACE · TRACEABLE RELATIONSHIP</span><h1>Baarbara<br>Estate.</h1><p class="muted">One growing origin, different roasters, different processing choices and different drinker experiences. This is a catalogue connection — not a promise the coffees taste alike.</p><div class="attention">Visual atmosphere is an illustration, <strong>not an estate photograph</strong>. Estate links must be checked against the ICB canonical origin mapping before production.</div><div class="buttons"><button class="primary small-btn" data-view="coffee" data-coffee="brew">Meet another interpretation ↗</button><button class="secondary" data-view="coffee" data-coffee="baarbara">Return to original coffee</button></div></div><div class="estate-art" role="img" aria-label="Stylized illustrated coffee-growing landscape, not a photo of Baarbara Estate"><div class="sun"></div><div class="hill"></div><span class="art-credit">Illustrative landscape · not a documentary image</span></div></div><section class="connections"><span class="eyebrow sea">SAME NAMED ORIGIN · DIFFERENT ROASTERS</span><h2>A connected selection.</h2><div class="relation-grid">${['baarbara','brew','blue'].map(id=>{const c=coffees[id];return `<button class="relation" data-view="coffee" data-coffee="${id}"><span class="type">${esc(c.roaster)}</span><span class="name">${esc(c.name)} ↗</span><span class="provenance">${c.count?`${c.count} current ratings · ${Number(c.rating).toFixed(1)}/5`:'No current independent ratings'} · ${esc(c.process)}</span></button>`}).join('')}</div></section>`;}
  function evidencePage(){return `${breadcrumb([{label:'Independent reviews'}])}<section class="estate-grid" style="min-height:520px"><div><span class="eyebrow sea">THE MEASURE OF TRUST</span><h1>What do we<br>really know?</h1><p class="muted">An honest score should reveal its limits. One opinion is valuable; it is not a consensus. Roaster tasting notes are useful context; they are not independent reviews.</p><div class="buttons"><button class="primary small-btn" data-view="coffee" data-coffee="mogra">Explore a rated coffee ↗</button><button class="secondary" data-view="coffee" data-coffee="baarbara">Explore an unrated coffee</button></div></div><div class="evidence"><span class="eyebrow">REVIEW COVERAGE · LIVE DB SNAPSHOT 9 NOV</span><div class="rating-display" style="margin-top:22px">147 <small>/ 1,714 active coffees</small></div><p class="muted">Have at least one current independent coffee review.</p><div class="divider"></div><div class="rating-display">16 <small>active coffees</small></div><p class="muted">Have at least three current reviews. Sample sizes are still small.</p><div class="divider"></div><p class="note">Review identities are not necessarily unique humans. Coverage varies by roaster. These numbers are a snapshot, not a published research benchmark.</p></div></section><section class="connections"><span class="eyebrow">TEST BOTH EVIDENCE STATES</span><h2>Two honest coffee cards.</h2><div class="relation-grid"><button class="relation" data-view="coffee" data-coffee="mogra"><span class="type">GREY SOUL · COMMUNITY EVIDENCE</span><span class="name">Mogra ↗</span><span class="provenance">6 current ratings · average 4.5/5 · small sample</span></button><button class="relation" data-view="coffee" data-coffee="amaltas"><span class="type">BLUE TOKAI · COMMUNITY EVIDENCE</span><span class="name">Amaltas Blend ↗</span><span class="provenance">11 current ratings · average ~3.7/5</span></button><button class="relation" data-view="coffee" data-coffee="baarbara"><span class="type">BAARBARA · REVIEW GAP</span><span class="name">Naturals Roasted Coffee Beans ↗</span><span class="provenance">0 current reviews · contribute only after trying it</span></button></div></section>`;}
  function showSearch(guide=false){state.search='';state.filter=guide?'natural':'all';overlay.innerHTML=`<div class="filter-overlay" id="search-dialog" role="presentation"><section class="filter-panel" role="dialog" aria-modal="true" aria-labelledby="search-title"><header><div><span class="eyebrow">${guide?'A GENTLE FIRST QUESTION':'DIRECT EXPLORATION'}</span><h2 id="search-title" style="margin:9px 0 0">${guide?'What sounds good?':'Find a coffee.'}</h2></div><button class="close" data-action="close" aria-label="Close search">×</button></header><p class="muted">${guide?'Choose a preference, or skip it. You stay in control.':'These are five real catalogue examples used for this prototype, not a full-directory search.'}</p><label for="search-input" class="form-label">Search by coffee or roaster</label><input id="search-input" class="searchbox" type="search" placeholder="e.g. Mogra, Baarbara, Blue Tokai" autocomplete="off"><span class="eyebrow sea">TRY AN EXPLORATION PATH</span><div class="filter-row">${[['all','All'],['natural','Natural process'],['rated','With ratings'],['unrated','Needs reviews'],['estate','Baarbara Estate']].map(([id,l])=>`<button class="chip" data-filter="${id}" aria-pressed="${state.filter===id}">${l}</button>`).join('')}</div><div class="results" id="results"></div><p class="subtle">No account required. Filters are optional. These preview facets cover only the five fixtures.</p></section></div>`;updateResults();document.getElementById('search-input').focus();}
  function updateResults(){const t=(state.search||'').toLowerCase().trim();const entries=Object.entries(coffees).filter(([id,c])=>{if(t&&!`${c.name} ${c.roaster} ${c.estate}`.toLowerCase().includes(t))return false;if(state.filter==='natural'&&c.process!=='Natural')return false;if(state.filter==='rated'&&c.count<1)return false;if(state.filter==='unrated'&&c.count>0)return false;if(state.filter==='estate'&&c.estate!=='Baarbara Estate')return false;return true});const el=document.getElementById('results');if(!el)return;el.innerHTML=entries.length?entries.map(([id,c])=>`<div class="result"><div><button data-view="coffee" data-coffee="${id}">${esc(c.name)} ↗</button><small>${esc(c.roaster)} · ${esc(c.process)} · ${esc(c.roast)}</small></div><span class="result-count">${c.count?`${c.count} ratings`:'No ratings'}</span></div>`).join(''):`<p class="muted" style="padding:20px 0">No matches in this five-coffee prototype. Try another filter.</p>`;}
  function showReview(){const c=coffees[state.coffee];state.rating=0;overlay.innerHTML=`<div class="modal-overlay" role="presentation"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="rate-title"><header><div><span class="eyebrow sea">TASTED IT? CONTRIBUTE INDEPENDENTLY</span><h2 id="rate-title" style="font-size:36px;margin:10px 0">Your experience matters.</h2></div><button class="close" data-action="close" aria-label="Close review">×</button></header><p class="muted"><strong style="color:var(--paper)">${esc(c.name)}</strong><br>${esc(c.roaster)}</p><label class="form-label">Your personal rating, after trying this coffee</label><div class="stars" role="group" aria-label="Choose a rating from 1 to 5">${[1,2,3,4,5].map(i=>`<button class="star" data-rating="${i}" aria-label="${i} ${i===1?'star':'stars'}" aria-pressed="false">★</button>`).join('')}</div><label class="form-label" for="brew-method">Brew method (optional)</label><select id="brew-method" class="field"><option value="">Prefer not to say</option><option>Pour-over</option><option>Aeropress</option><option>Espresso</option><option>Immersion</option><option>Other</option></select><label class="form-label" for="tasting-note">A few words about your cup (optional)</label><textarea id="tasting-note" class="field" maxlength="500" placeholder="What stood out? No polished tasting vocabulary needed."></textarea><div class="status"><strong>Prototype only.</strong> Nothing will be saved, transmitted or published. Production contribution awaits review-integrity safeguards.</div><button id="submit-preview" data-action="submit-preview" class="primary" disabled>Preview rating flow ↗</button></section></div>`;const first=overlay.querySelector('[data-rating="1"]');if(first)first.focus();}
  function about(){overlay.innerHTML=`<div class="modal-overlay"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="about-title"><header><div><span class="eyebrow">EXPERIENCE LAB</span><h2 id="about-title" style="font-size:39px;margin:10px 0">What to test.</h2></div><button class="close" data-action="close" aria-label="Close">×</button></header><p class="muted">The prototype covers a neutral public entry, optional discovery, coffee-to-estate-to-other-roaster traversal, independent review evidence, and a clearly non-persistent rating interaction.</p><p class="muted">Try search/filters, coffee/estate links, Back/Forward, keyboard Tab, the returning-state toggle, and both rated/unrated examples. The catalogue names, slugs and score snapshots were checked against ICB Supabase on 9 November 2026.</p><div class="attention">Not implemented: authentication, real personalization, database writes, SEO production routes, a full knowledge graph or production analytics. Product silhouettes and the landscape are stylized illustrations.</div><button class="primary small-btn" data-action="close">Return to Atlas ↗</button></section></div>`;overlay.querySelector('.close')?.focus();}
  document.addEventListener('click',e=>{const btn=e.target.closest('button');if(!btn)return;if(btn.dataset.view){nav(btn.dataset.view,btn.dataset.coffee);return}const a=btn.dataset.action;if(a==='search')showSearch();else if(a==='guide')showSearch(true);else if(a==='review')showReview();else if(a==='close')overlay.innerHTML='';else if(a==='submit-preview'){const el=overlay.querySelector('.status');if(el)el.innerHTML=`<strong>${state.rating} / 5 — preview captured locally.</strong> This interaction demonstrates the flow only. No review was submitted, saved, or counted.`;btn.textContent='Nothing submitted · close to continue';btn.disabled=true;}if(btn.dataset.filter){state.filter=btn.dataset.filter;overlay.querySelectorAll('[data-filter]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.filter===state.filter)));updateResults()}if(btn.dataset.rating){state.rating=Number(btn.dataset.rating);overlay.querySelectorAll('[data-rating]').forEach(b=>{const on=Number(b.dataset.rating)<=state.rating;b.classList.toggle('filled',on);b.setAttribute('aria-pressed',String(Number(b.dataset.rating)===state.rating))});document.getElementById('submit-preview').disabled=false;}});
  document.getElementById('search-btn').addEventListener('click',()=>showSearch());document.getElementById('home-btn').addEventListener('click',()=>nav('home'));document.getElementById('nav-home').addEventListener('click',()=>nav('home'));document.getElementById('nav-coffee').addEventListener('click',()=>nav('coffee','baarbara'));document.getElementById('nav-estate').addEventListener('click',()=>nav('estate'));document.getElementById('nav-evidence').addEventListener('click',()=>nav('evidence'));document.getElementById('mode-btn').addEventListener('click',()=>{state.returning=!state.returning;render();});document.getElementById('about-prototype').addEventListener('click',about);
  document.addEventListener('input',e=>{if(e.target.id==='search-input'){state.search=e.target.value;updateResults();}});document.addEventListener('keydown',e=>{if(e.key==='Escape')overlay.innerHTML='';if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();showSearch()}});window.addEventListener('popstate',e=>{const p=new URLSearchParams(location.search);state.view=['home','coffee','estate','evidence'].includes(p.get('view'))?p.get('view'):'home';state.coffee=coffees[p.get('coffee')]?p.get('coffee'):'baarbara';overlay.innerHTML='';render();});const p=new URLSearchParams(location.search);if(['home','coffee','estate','evidence'].includes(p.get('view')))state.view=p.get('view');if(coffees[p.get('coffee')])state.coffee=p.get('coffee');render();
})();
</script></body></html>
