<body>
<div class="lab-banner"><span><b>ICB · PHASE 1B / SITE EXPERIENCE LAB</b> &nbsp; Atlas + existing page hierarchy · all real links open the live ICB site · <strong>Not a live website</strong></span><button id="about-prototype">What works?</button></div>
<div class="shell"><header class="header"><button class="brand" id="home-btn" aria-label="Back to Atlas homepage"><span class="full">INDIAN COFFEE BEANS</span><span class="short">ICB</span></button><nav class="nav" aria-label="Primary"><button id="nav-home">Atlas</button><button id="nav-explore">Explore</button><button id="nav-learn">Learn</button><button id="nav-tools">Tools</button><button id="nav-my">My Coffee</button><button id="nav-evidence">Reviews</button></nav><div class="head-right"><button class="iconbtn mode" id="mode-btn" aria-pressed="false">Returning preview: off</button><button class="iconbtn" id="search-btn">⌕ &nbsp; Search / Filter</button></div></header><nav class="mobile-ribbon" aria-label="Site sections"><button data-view="home">Atlas</button><button data-view="explore">Explore</button><button data-view="learn">Learn</button><button data-view="tools">Tools</button><button data-view="my">My Coffee</button><button data-view="evidence">Reviews</button></nav><main id="main-content" tabindex="-1"></main><footer class="footer"><span>Discover freely. Judge independently. Help document Indian coffee.</span><span><a href="https://www.indiancoffeebeans.com/coffees" target="_blank" rel="noopener noreferrer">Coffees</a> &nbsp;·&nbsp; <a href="https://www.indiancoffeebeans.com/roasters" target="_blank" rel="noopener noreferrer">Roasters</a> &nbsp;·&nbsp; <a href="https://www.indiancoffeebeans.com/regions" target="_blank" rel="noopener noreferrer">Regions</a> &nbsp;·&nbsp; <a href="https://www.indiancoffeebeans.com/curations" target="_blank" rel="noopener noreferrer">Curations</a> &nbsp;·&nbsp; <a href="https://www.indiancoffeebeans.com/learn" target="_blank" rel="noopener noreferrer">Learn</a> &nbsp;·&nbsp; <a href="https://www.indiancoffeebeans.com/tools" target="_blank" rel="noopener noreferrer">Tools</a></span></footer></div><div id="overlay-root"></div>
<script>
(()=>{'use strict';
  const coffees={
    baarbara:{id:'1e8fa09d-12d7-4ccb-a76c-38818d9a8dde',name:'Naturals Roasted Coffee Beans',roaster:'Baarbara Coffee',roasterSlug:'baarbara-coffee',slug:'naturals',process:'Natural',roast:'Light',estate:'Baarbara Estate',variety:'SLN 795',notes:'Mango · dry coconut',source:'Roaster-described notes; not independent tasting evidence',count:0,rating:null,art:'original'},
    brew:{id:'edba9b13-c2a5-40f3-885f-5f1321e07198',name:'Baarbara Naturals',roaster:'BrewClan Coffee Roasters',roasterSlug:'brewclan-coffee-roasters',slug:'baarbara-naturals',process:'Natural',roast:'Light-medium',estate:'Baarbara Estate',variety:'Not confirmed',notes:'Berry · citrus',source:'Roaster-described notes; not independent tasting evidence',count:0,rating:null,art:'brew'},
    blue:{id:'1d73df68-3e46-4e3b-81f3-2d208a953e8c',name:'Baarbara Estate',roaster:'Blue Tokai Coffee',roasterSlug:'blue-tokai-coffee',slug:'baarbara-estate',process:'Washed',roast:'Medium-dark',estate:'Baarbara Estate',variety:'Not confirmed',notes:'Catalogue details',source:'Catalogue facts, not an ICB tasting conclusion',count:2,rating:4.5,art:'blue'},
    mogra:{id:'eb9b1380-2a12-473c-b2e7-d116c653ad6b',name:'Mogra',roaster:'Grey Soul Coffee Roasters',roasterSlug:'grey-soul-coffee-roasters',slug:'mogra-light-roast',process:'See catalogue',roast:'See catalogue',estate:'Not verified',variety:'Not confirmed',notes:'Independent community feedback available',source:'ICB review aggregate as of 9 Nov 2026',count:6,rating:4.5,art:'mogra'},
    amaltas:{id:'ab5ec84e-8287-48f4-addd-b983a95b716a',name:'Amaltas Blend',roaster:'Blue Tokai Coffee',roasterSlug:'blue-tokai-coffee',slug:'cold-brew-blend-light',process:'Blend',roast:'See catalogue',estate:'Not a single verified estate',variety:'Not confirmed',notes:'Independent community feedback available',source:'ICB review aggregate as of 9 Nov 2026',count:11,rating:3.73,art:'blue'}
  };
  const state={view:'home',coffee:'baarbara',returning:false,search:'',filter:'all',rating:0,lens:'brew'};
  const main=document.getElementById('main-content'),overlay=document.getElementById('overlay-root');
  const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const pathFor=c=>`https://www.indiancoffeebeans.com/roasters/${c.roasterSlug}/coffees/${c.slug}`;
  const link=(name,view,coffee)=>`<button class="textlink" data-view="${view}" ${coffee?`data-coffee="${coffee}"`:''}>${name} ↗</button>`;
  function nav(view,coffee,push=true){ if(!['home','coffee','estate','evidence','explore','learn','tools','my'].includes(view))view='home';state.view=view;if(coffee&&coffees[coffee])state.coffee=coffee;overlay.innerHTML='';if(push){try{history.pushState({view:state.view,coffee:state.coffee},'',`?view=${state.view}${state.view==='coffee'?`&coffee=${state.coffee}`:''}`)}catch(_){/* Local file previews can restrict History API; navigation remains functional. */}}render();window.scrollTo({top:0,behavior:'instant'}); }
  function render(){document.querySelectorAll('.nav button').forEach(b=>b.removeAttribute('aria-current'));const n=document.getElementById('nav-'+state.view);if(n)n.setAttribute('aria-current','page');document.getElementById('mode-btn').setAttribute('aria-pressed',String(state.returning));document.getElementById('mode-btn').textContent=`Returning preview: ${state.returning?'on':'off'}`;
    if(state.view==='home')main.innerHTML=home();else if(state.view==='estate')main.innerHTML=estate();else if(state.view==='evidence')main.innerHTML=evidencePage();else if(['explore','learn','tools','my'].includes(state.view))main.innerHTML=hub(state.view);else main.innerHTML=coffeePage(); }
  function homeBase(){return `<section class="home-grid" aria-labelledby="home-heading"><div class="intro"><span class="eyebrow">INDIAN SPECIALTY COFFEE · INDEPENDENTLY UNDERSTOOD</span><h1 id="home-heading">${state.returning?'Pick up where you left off.':'A coffee can take you places.'}</h1><p class="muted">${state.returning?'An illustrative returning-visitor state. A real version would use only your saved preferences and browsing choices.':'Follow the connections between coffees, estates, roasters and what real people thought of their cups.'}</p><div class="paths"><span class="eyebrow">${state.returning?'YOUR NEXT MOVE':'HOW WOULD YOU LIKE TO BEGIN?'}</span><button class="path-choice" data-action="search"><span><span class="serif">I know what I want</span><small>Go straight to process, roast, roaster or reviews</small></span><span class="arrow">↗</span></button><button class="path-choice" data-action="guide"><span><span class="serif">Help me discover</span><small>Optional preferences, never a compulsory quiz</small></span><span class="arrow">↗</span></button><button class="path-choice" data-view="coffee" data-coffee="baarbara"><span><span class="serif">Follow a coffee thread</span><small>Open a real catalogue coffee, by choice</small></span><span class="arrow">↗</span></button></div></div>
    <div class="atlas-stage" aria-label="Illustration: a coffee at the centre of a network of relationships"><div class="orbit"></div><div class="orbit o2"></div><div class="orbit o3"></div><div class="axis"></div><div class="axis b"></div><div class="stage-label l1"><em>01 / COFFEE</em>A distinct roast</div><div class="stage-label l2"><em>02 / PLACE</em>An estate or region</div><div class="stage-label l3"><em>03 / EVIDENCE</em>Independent reviews</div><div class="core-art"><div class="sheet"></div><div class="sheet two"></div><div class="bean"></div></div><div class="home-stage-caption">Start anywhere. Keep your bearings.</div></div>
    <aside class="insight"><span class="eyebrow sea">WHY ICB EXISTS</span><h3 class="serif" style="margin:16px 0">The story is interesting.<br>The evidence matters.</h3><p class="muted">Coffee labels describe what a roaster says. Community ratings tell you what drinkers experienced. We keep those voices distinct.</p><div class="rule"></div><div class="big-number">1,714</div><p class="subtle">active catalogue coffees · snapshot on 9 November 2026</p><div class="rule"></div><div class="entity-note">Only 147 have an independent review.</div><p class="subtle">Sparse evidence is a reason to invite contributions, not invent certainty.</p>${link('Explore coffee with reviews','coffee','mogra')}</aside></section>`;}
  function breadcrumb(items){return `<div class="breadcrumb"><button data-view="home">Atlas</button>${items.map(x=>`<span class="sep">/</span>${x.view?`<button data-view="${x.view}" ${x.coffee?`data-coffee="${x.coffee}"`:''}>${esc(x.label)}</button>`:`<span>${esc(x.label)}</span>`}`).join('')}</div>`;}
  function pack(c){return `<div class="showcase" aria-label="Stylized product silhouette, not an official package photograph"><div class="coffee-pack ${c.art==='original'?'':c.art}"><span class="pack-top">${esc(c.roaster.split(' ')[0].toUpperCase())}</span><span class="pack-line">Specialty coffee</span><span class="pack-bottom">${esc(c.name.length>24?c.name.slice(0,23)+'…':c.name)}</span><span style="font-size:9px;letter-spacing:.11em">INDIA · COFFEE</span></div><div class="showcase-label left"><small>ORIGIN CONTEXT</small>${esc(c.estate)}</div><div class="showcase-label right"><small>ROASTER</small>${esc(c.roaster)}</div></div>`;}
  function review(c){return `<aside class="evidence" aria-label="Independent review evidence"><span class="eyebrow sea">INDEPENDENT COMMUNITY EVIDENCE</span>${c.count?`<h3>What drinkers rated</h3><div class="rating-display">${Number(c.rating).toFixed(1)} <small>/ 5</small></div><p class="count">${c.count} current ${c.count===1?'rating':'ratings'} · snapshot on 9 November 2026</p><p class="note">${c.count<5?'Small sample. Treat this as early feedback, not a definitive verdict.':'This is a community average, not a verified taste guarantee.'}</p>`:`<h3>No independent ratings. Yet.</h3><p class="quote">The catalogue knows this coffee.<br>We still need your experience.</p><p class="note">Zero current ratings in our 9 November snapshot. No invented score, no roaster notes disguised as reviews.</p>`}<div class="divider"></div><p class="note"><strong style="color:var(--paper)">Tried this coffee?</strong><br>Rate it in seconds. Add tasting context only if you want to.</p><button class="primary small-btn" data-action="review">Rate after trying <span>↗</span></button><p class="subtle" style="margin-top:15px">Prototype only: the rating flow does not publish or save anything.</p></aside>`;}
  function coffeePage(){const c=coffees[state.coffee];return `${breadcrumb([{label:c.roaster},{label:c.name}])}<section class="detail-grid" aria-labelledby="coffee-heading"><div class="detail-copy"><span class="eyebrow">A COFFEE, IN CONTEXT</span><h1 id="coffee-heading">${esc(c.name)}.</h1><p class="muted">Roasted by <strong style="color:var(--paper)">${esc(c.roaster)}</strong>. Explore where it came from, how it was described, and what the independent community actually recorded.</p><div class="meta"><strong>PROCESS</strong> &nbsp; ${esc(c.process)}<br><strong>ROAST</strong> &nbsp; ${esc(c.roast)}<br><strong>ORIGIN</strong> &nbsp; ${esc(c.estate)}</div><div class="attention"><strong>Source distinction:</strong> ${esc(c.source)}.</div><div class="buttons"><a class="primary small-btn" href="${pathFor(c)}" target="_blank" rel="noopener noreferrer">View real ICB listing ↗</a><button class="secondary" data-action="search">Explore other coffees</button></div></div>${pack(c)}${review(c)}</section><section class="connections"><span class="eyebrow">THE RELATIONSHIPS · EXPLICIT AND GROUNDED</span><h2>Take a meaningful next step.</h2><div class="relation-grid">${c.estate==='Baarbara Estate'?`<button class="relation" data-view="estate"><span class="type">FACTUAL ORIGIN THREAD</span><span class="name">Baarbara Estate ↗</span><span class="provenance">Explore catalogue-linked interpretations · estate relationship</span></button>`:`<button class="relation" data-view="evidence"><span class="type">COMMUNITY EVIDENCE</span><span class="name">How much can we trust a score? ↗</span><span class="provenance">Sample sizes and evidence coverage · ICB methodology</span></button>`}<button class="relation" data-view="coffee" data-coffee="${state.coffee==='mogra'?'amaltas':'mogra'}"><span class="type">DIFFERENT COFFEE · INDEPENDENT SCORES</span><span class="name">${state.coffee==='mogra'?'Amaltas Blend':'Grey Soul · Mogra'} ↗</span><span class="provenance">A separate catalogue entry, not a claimed flavour match</span></button><button class="relation" data-view="evidence"><span class="type">HOW EVIDENCE WORKS</span><span class="name">Ratings are not facts about taste ↗</span><span class="provenance">See rating counts, coverage, and limitations</span></button></div></section>`;}
  function estate(){return `${breadcrumb([{label:'Naturals',view:'coffee',coffee:'baarbara'},{label:'Baarbara Estate'}])}<div class="estate-grid"><div><span class="eyebrow">PLACE · TRACEABLE RELATIONSHIP</span><h1>Baarbara<br>Estate.</h1><p class="muted">One growing origin, different roasters, different processing choices and different drinker experiences. This is a catalogue connection — not a promise the coffees taste alike.</p><div class="attention">Visual atmosphere is an illustration, <strong>not an estate photograph</strong>. All three sample coffee-to-estate links were checked against ICB canonical origin mapping. The broader Atlas graph still requires validation.</div><div class="buttons"><button class="primary small-btn" data-view="coffee" data-coffee="brew">Meet another interpretation ↗</button><button class="secondary" data-view="coffee" data-coffee="baarbara">Return to original coffee</button></div></div><div class="estate-art" role="img" aria-label="Stylized illustrated coffee-growing landscape, not a photo of Baarbara Estate"><div class="sun"></div><div class="hill"></div><span class="art-credit">Illustrative landscape · not a documentary image</span></div></div><section class="connections"><span class="eyebrow sea">SAME NAMED ORIGIN · DIFFERENT ROASTERS</span><h2>A connected selection.</h2><div class="relation-grid">${['baarbara','brew','blue'].map(id=>{const c=coffees[id];return `<button class="relation" data-view="coffee" data-coffee="${id}"><span class="type">${esc(c.roaster)}</span><span class="name">${esc(c.name)} ↗</span><span class="provenance">${c.count?`${c.count} current ratings · ${Number(c.rating).toFixed(1)}/5`:'No current independent ratings'} · ${esc(c.process)}</span></button>`}).join('')}</div></section>`;}
  function evidencePage(){return `${breadcrumb([{label:'Independent reviews'}])}<section class="estate-grid" style="min-height:520px"><div><span class="eyebrow sea">THE MEASURE OF TRUST</span><h1>What do we<br>really know?</h1><p class="muted">An honest score should reveal its limits. One opinion is valuable; it is not a consensus. Roaster tasting notes are useful context; they are not independent reviews.</p><div class="buttons"><button class="primary small-btn" data-view="coffee" data-coffee="mogra">Explore a rated coffee ↗</button><button class="secondary" data-view="coffee" data-coffee="baarbara">Explore an unrated coffee</button></div></div><div class="evidence"><span class="eyebrow">REVIEW COVERAGE · LIVE DB SNAPSHOT 9 NOV</span><div class="rating-display" style="margin-top:22px">147 <small>/ 1,714 active coffees</small></div><p class="muted">Have at least one current independent coffee review.</p><div class="divider"></div><div class="rating-display">16 <small>active coffees</small></div><p class="muted">Have at least three current reviews. Sample sizes are still small.</p><div class="divider"></div><p class="note">Review identities are not necessarily unique humans. Coverage varies by roaster. These numbers are a snapshot, not a published research benchmark.</p></div></section><section class="connections"><span class="eyebrow">TEST BOTH EVIDENCE STATES</span><h2>Two honest coffee cards.</h2><div class="relation-grid"><button class="relation" data-view="coffee" data-coffee="mogra"><span class="type">GREY SOUL · COMMUNITY EVIDENCE</span><span class="name">Mogra ↗</span><span class="provenance">6 current ratings · average 4.5/5 · small sample</span></button><button class="relation" data-view="coffee" data-coffee="amaltas"><span class="type">BLUE TOKAI · COMMUNITY EVIDENCE</span><span class="name">Amaltas Blend ↗</span><span class="provenance">11 current ratings · average ~3.7/5</span></button><button class="relation" data-view="coffee" data-coffee="baarbara"><span class="type">BAARBARA · REVIEW GAP</span><span class="name">Naturals Roasted Coffee Beans ↗</span><span class="provenance">0 current reviews · contribute only after trying it</span></button></div></section>`;}

  const ROOT='https://www.indiancoffeebeans.com';
  const lenses={
    brew:{label:'Brew method',heading:'Begin with how you brew.',copy:'A V60, AeroPress or filter coffee preparation is already a meaningful entrance. Keep the recipes and method guides one step away.',symbol:'V60',primary:['Explore pour-over coffees','/coffees/v60'],secondary:['Open the brew calculator','/tools/coffee-calculator'],tertiary:['All coffee methods','/coffees']},
    flavour:{label:'Flavour',heading:'Follow what you taste.',copy:'Explore flavour language without pretending roaster descriptions are independent tasting results. Compare those claims with actual community evidence.',symbol:'◌',primary:['Browse coffees with filters','/coffees'],secondary:['Read the glossary','/learn/glossary'],tertiary:['Community evidence',null]},
    process:{label:'Process',heading:'The method changes the cup.',copy:'Natural, washed, honey and experimental processing each lead to real, indexable coffee discovery pages and useful educational context.',symbol:'≈',primary:['Natural-process coffees','/coffees/natural'],secondary:['All coffees and process filters','/coffees'],tertiary:['Coffee field guide','/learn']},
    origin:{label:'Origin',heading:'Start with a place.',copy:'Move between Indian growing regions and verified estate relationships. Origin tells us where it began, not whether a review is positive.',symbol:'⌖',primary:['Indian coffee regions','/regions'],secondary:['Explore a verified estate thread',null],tertiary:['All roasters','/roasters']},
    roaster:{label:'Roaster',heading:'Understand who roasted it.',copy:'Roaster pages remain first-class directories. Discover their coffee catalogues and independent review evidence without selling prominence.',symbol:'R',primary:['Browse all roasters','/roasters'],secondary:['Coffee directory','/coffees'],tertiary:['How ICB works','/how-icb-works']},
    community:{label:'Community evidence',heading:'Read what drinkers found.',copy:'A useful rating tells you how many people contributed and how limited that sample may be. Never confuse a seller tasting note with a review.',symbol:'★',primary:['Explore the review evidence',null],secondary:['See the coffee directory','/coffees'],tertiary:['How ICB works','/how-icb-works']}
  };
  function lensAction(pair,kind){const label=esc(pair[0]);if(pair[1])return `<a class="textlink" href="${ROOT+pair[1]}" target="_blank" rel="noopener noreferrer">${label} ↗</a>`; if(kind==='primary'&&state.lens==='community')return `<button class="textlink" data-view="evidence">${label} ↗</button>`;if(state.lens==='origin')return `<button class="textlink" data-view="estate">${label} ↗</button>`;return `<button class="textlink" data-view="evidence">${label} ↗</button>`;}
  function homeWorld(){const l=lenses[state.lens];return `<section class="world" aria-labelledby="world-title"><div class="world-top"><div><span class="eyebrow">THE LIVING DIRECTORY · ONE CONNECTED WORLD</span><h2 id="world-title">Choose a way in.</h2></div><p class="muted">The directory, people, field guide, brewing tools and independent reviews are all parts of the same experience. Select a lens; the world responds.</p></div><div class="world-body"><div class="lens-list" aria-label="Select what to explore">${Object.entries(lenses).map(([id,q])=>`<button class="lens-button" data-lens="${id}" aria-pressed="${id===state.lens}"><span>${esc(q.label)}</span><span aria-hidden="true">↗</span></button>`).join('')}</div><div class="lens-panel" aria-live="polite"><div><span class="eyebrow sea">SELECTED LENS / ${esc(l.label)}</span><h3>${esc(l.heading)}</h3><p class="muted">${esc(l.copy)}</p><div style="display:flex;flex-wrap:wrap;gap:9px 22px;margin-top:20px">${lensAction(l.primary,'primary')}${lensAction(l.secondary,'secondary')}${lensAction(l.tertiary,'tertiary')}</div></div><div class="lens-rings" aria-hidden="true"><span class="lens-center">${esc(l.symbol)}</span></div></div></div><div class="journey-reach"><div><span class="eyebrow sea">THE REVIEW JOURNAL</span><h4>What people actually thought.</h4><p>Community evidence, with sample sizes visible. Rate a coffee only if you've tried it.</p><button class="textlink" data-view="evidence">See independent reviews ↗</button></div><div><span class="eyebrow sea">THE CATALOGUE</span><h4>Freshly added, never sponsored.</h4><p>New additions are an objective listing signal, not recommendations or featured roasters.</p><a class="textlink" href="${ROOT}/coffees?sort=newest" target="_blank" rel="noopener noreferrer">Browse latest additions ↗</a></div><div><span class="eyebrow sea">THE FIELD GUIDE</span><h4>Learn. Then make a cup.</h4><p>Articles and practical utilities remain one step away from the subject that prompted them.</p><button class="textlink" data-view="learn">Enter Learn & Tools ↗</button></div></div></section>`;}
  function home(){return homeBase()+homeWorld();}
  const rooms={
    explore:{
      eyebrow:'EXPLORE / THE CONNECTED CATALOGUE',heading:'Find the coffee. Follow the story.',copy:'The Atlas never replaces a useful directory. Enter through exactly what you know, or roam through real relations.',note:'The familiar routes stay. /coffees, /roasters and /regions continue to be the canonical gateways. The Atlas is the connective tissue.',
      entries:[['Coffees','DIRECTORY','Filter, sort and compare coffees by brew method, roast, process, price, origin and more.','/coffees'],['Roasters','DIRECTORY','Browse each roaster and its own collection without covert paid placement.','/roasters'],['Regions','GEOGRAPHY','Explore Indian coffee-growing states, regions and the existing map.','/regions'],['Curations','PEOPLE','Independent selections from cafés, baristas and experienced coffee people.','/curations'],['Communities','COMMUNITY','Find active Indian specialty coffee groups and communities.','/communities'],['Estates','PLANNED ENTITY','Estate relationships exist in the data; their public pages are not yet launched.',null]],
      shortcuts:[['Pour-over','/coffees/v60'],['Natural process','/coffees/natural'],['Current reviews',null]]
    },
    learn:{
      eyebrow:'LEARN / THE INDIAN COFFEE FIELD GUIDE',heading:'Understand what is in the cup.',copy:'The content is not an unrelated blog. Each relevant article can eventually connect back to its verified subjects in the Atlas.',note:'Editorial explanations and roaster claims remain distinct from community opinions. Existing Sanity article URLs stay canonical.',
      entries:[['Articles','FIELD GUIDE','The complete archive of educational and origin storytelling.','/learn'],['Reading series','LEARNING PATH','Longer topics, written in a meaningful reading order.','/learn/series'],['Glossary','COFFEE LANGUAGE','Quick reference for unfamiliar brewing and processing terms.','/learn/glossary'],['Data insights','RESEARCH','ICB’s separate, sourced data and industry insight articles.','/learn/insights'],['Learn from origin','CONNECTION','Browse real growing regions and their coffee relationships.','/regions'],['Put it into practice','WORKBENCH','Brewing tools and practical recipes, available without a forced account.','/tools']],
      shortcuts:[['All articles','/learn'],['Coffee glossary','/learn/glossary'],['Try tools','/tools']]
    },
    tools:{
      eyebrow:'TOOLS / THE BREWING WORKBENCH',heading:'Now make a better cup.',copy:'Keep utilities fast and practical, not buried inside animations. The Atlas brings them into context when someone needs them.',note:'Every tool here already has a real public URL. No new feature or AI-generated brewing recommendation is implied.',
      entries:[['Brew calculator','PRACTICAL TOOL','Get ratio and brew-time assistance while making your coffee.','/tools/coffee-calculator'],['Expert recipes','RECIPE LIBRARY','Explore specialist brewing recipes and approaches.','/tools/expert-recipes'],['Coffee Compass','BREW DIAGNOSIS','Diagnose an unpleasant cup and explore adjustments.','/tools/coffee-compass'],['Grind converter','TECHNICAL REFERENCE','Translate grind settings and units across brewing equipment.','/tools/grind-size-converter'],['Explore coffees','CROSS-REFERENCE','Discover real coffees for the method you are practicing.','/coffees'],['Learn the why','EDUCATION','Read explanations of brewing, roasting and coffee origins.','/learn']],
      shortcuts:[['All tools','/tools'],['Pour-over coffees','/coffees/v60'],['Glossary','/learn/glossary']]
    },
    my:{
      eyebrow:'MY COFFEE / A PERSONAL FIELD GUIDE',heading:'Make discovery your own.',copy:'Your reviews, wishlist and taste preferences belong in your personal space. An anonymous visitor can still explore everything.',note:'This is a UI simulation, not a signed-in account. The toggle shows potential recognition; it does not read user data or claim that “visited” means “tried”.',
      entries:[['My reviews','YOUR CONTRIBUTIONS','A record of actual independent coffee submissions, with review edit rights.','/dashboard/my-reviews'],['Wishlist','SAVE FOR LATER','Keep coffees you want to try without falsely marking them tasted.','/dashboard/wishlist'],['Taste preferences','PERSONAL SETTINGS','Explicit brewing and flavour preferences — not inferred purchase history.','/dashboard/preferences'],['My profile','YOUR PUBLIC IDENTITY','Control the profile and contributions that other coffee lovers can see.','/profile'],['My dashboard','YOUR SPACE','Private account hub for ongoing coffee discovery.','/dashboard'],['Privacy and control','YOUR DATA','Keep profile and identity controls accessible, not behind an AI assistant.','/dashboard/privacy']],
      shortcuts:[['Sign in','/auth'],['Review example',null],['Browse anonymously','/coffees']]
    }
  };
  function hub(view){const h=rooms[view];const cards=h.entries.map(([name,type,desc,href])=>`<article class="room"><span class="type">${esc(type)}</span><h3>${esc(name)}</h3><p>${esc(desc)}</p>${href?`<a href="${ROOT+href}" target="_blank" rel="noopener noreferrer">Open existing ICB page ↗</a>`:`<span class="subtle">Not yet a published page</span>`}</article>`).join('');const links=h.shortcuts.map(([t,p])=>p?`<a href="${ROOT+p}" target="_blank" rel="noopener noreferrer">${esc(t)} ↗</a>`:`<button class="secondary" data-view="${view==='my'?'coffee':'evidence'}" data-coffee="baarbara">${esc(t)} ↗</button>`).join('');return `<section class="hub-shell" aria-labelledby="hub-heading"><div class="hub-top"><div><span class="eyebrow">${esc(h.eyebrow)}</span><h1 id="hub-heading">${esc(h.heading)}</h1><p class="muted">${esc(h.copy)}</p></div><aside class="hub-note"><strong>DESIGN INTENT / NOT A NEW LIVE ROUTE</strong><p class="muted">${esc(h.note)}</p></aside></div><div class="room-grid">${cards}</div><div class="room-footer"><h3>Keep exploring.</h3><div class="hub-shortcuts">${links}</div></div><div class="path-preview"><div><span class="eyebrow sea">ONE SITE / MANY WAYS IN</span><h3>Every room leads back to a coffee.</h3><p>The same Atlas can explain a named coffee, show its independently reviewed evidence, and take you onward to its growing origin. None of these practical pages need to become a fake 3D object.</p><button class="textlink" data-view="coffee" data-coffee="baarbara">Try a real coffee thread ↗</button></div><div class="atlas-stage" style="min-height:280px"><div class="orbit" style="width:240px"></div><div class="orbit o2" style="width:155px"></div><div class="core-art" style="transform:scale(.6)"><div class="sheet"></div><div class="sheet two"></div><div class="bean"></div></div></div></div></section>`;}

  function showSearch(guide=false){state.search='';state.filter=guide?'natural':'all';overlay.innerHTML=`<div class="filter-overlay" id="search-dialog" role="presentation"><section class="filter-panel" role="dialog" aria-modal="true" aria-labelledby="search-title"><header><div><span class="eyebrow">${guide?'A GENTLE FIRST QUESTION':'DIRECT EXPLORATION'}</span><h2 id="search-title" style="margin:9px 0 0">${guide?'What sounds good?':'Find a coffee.'}</h2></div><button class="close" data-action="close" aria-label="Close search">×</button></header><p class="muted">${guide?'Choose a preference, or skip it. You stay in control.':'These are five real catalogue examples used for this prototype, not a full-directory search.'}</p><label for="search-input" class="form-label">Search by coffee or roaster</label><input id="search-input" class="searchbox" type="search" placeholder="e.g. Mogra, Baarbara, Blue Tokai" autocomplete="off"><span class="eyebrow sea">TRY AN EXPLORATION PATH</span><div class="filter-row">${[['all','All'],['natural','Natural process'],['rated','With ratings'],['unrated','Needs reviews'],['estate','Baarbara Estate']].map(([id,l])=>`<button class="chip" data-filter="${id}" aria-pressed="${state.filter===id}">${l}</button>`).join('')}</div><div class="results" id="results"></div><p class="subtle">No account required. Filters are optional. These preview facets cover only the five fixtures.</p></section></div>`;updateResults();document.getElementById('search-input').focus();}
  function updateResults(){const t=(state.search||'').toLowerCase().trim();const entries=Object.entries(coffees).filter(([id,c])=>{if(t&&!`${c.name} ${c.roaster} ${c.estate}`.toLowerCase().includes(t))return false;if(state.filter==='natural'&&c.process!=='Natural')return false;if(state.filter==='rated'&&c.count<1)return false;if(state.filter==='unrated'&&c.count>0)return false;if(state.filter==='estate'&&c.estate!=='Baarbara Estate')return false;return true});const el=document.getElementById('results');if(!el)return;el.innerHTML=entries.length?entries.map(([id,c])=>`<div class="result"><div><button data-view="coffee" data-coffee="${id}">${esc(c.name)} ↗</button><small>${esc(c.roaster)} · ${esc(c.process)} · ${esc(c.roast)}</small></div><span class="result-count">${c.count?`${c.count} ratings`:'No ratings'}</span></div>`).join(''):`<p class="muted" style="padding:20px 0">No matches in this five-coffee prototype. Try another filter.</p>`;}
  function showReview(){const c=coffees[state.coffee];state.rating=0;overlay.innerHTML=`<div class="modal-overlay" role="presentation"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="rate-title"><header><div><span class="eyebrow sea">TASTED IT? CONTRIBUTE INDEPENDENTLY</span><h2 id="rate-title" style="font-size:36px;margin:10px 0">Your experience matters.</h2></div><button class="close" data-action="close" aria-label="Close review">×</button></header><p class="muted"><strong style="color:var(--paper)">${esc(c.name)}</strong><br>${esc(c.roaster)}</p><label class="form-label">Your personal rating, after trying this coffee</label><div class="stars" role="group" aria-label="Choose a rating from 1 to 5">${[1,2,3,4,5].map(i=>`<button class="star" data-rating="${i}" aria-label="${i} ${i===1?'star':'stars'}" aria-pressed="false">★</button>`).join('')}</div><label class="form-label" for="brew-method">Brew method (optional)</label><select id="brew-method" class="field"><option value="">Prefer not to say</option><option>Pour-over</option><option>Aeropress</option><option>Espresso</option><option>Immersion</option><option>Other</option></select><label class="form-label" for="tasting-note">A few words about your cup (optional)</label><textarea id="tasting-note" class="field" maxlength="500" placeholder="What stood out? No polished tasting vocabulary needed."></textarea><div class="status"><strong>Prototype only.</strong> Nothing will be saved, transmitted or published. Production contribution awaits review-integrity safeguards.</div><button id="submit-preview" data-action="submit-preview" class="primary" disabled>Preview rating flow ↗</button></section></div>`;const first=overlay.querySelector('[data-rating="1"]');if(first)first.focus();}
  function about(){overlay.innerHTML=`<div class="modal-overlay"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="about-title"><header><div><span class="eyebrow">EXPERIENCE LAB</span><h2 id="about-title" style="font-size:39px;margin:10px 0">What to test.</h2></div><button class="close" data-action="close" aria-label="Close">×</button></header><p class="muted">This Phase 1B prototype adds Explore, Learn, Tools and My Coffee information-architecture previews to the neutral Atlas homepage; it preserves the coffee-to-estate thread and independent review states. All external links open existing live ICB pages.</p><p class="muted">Try the primary navigation, scroll to Choose a way in, switch its six lenses, follow links to real ICB pages, check keyboard Tab / Back, toggle simulated returning state, and inspect rated and unrated example coffees. The catalogue names, slugs and score snapshots were checked against ICB Supabase on 9 November 2026.</p><div class="attention">Not implemented: authentication, real personalization, database writes, SEO production routes, a full knowledge graph or production analytics. Product silhouettes and the landscape are stylized illustrations.</div><button class="primary small-btn" data-action="close">Return to Atlas ↗</button></section></div>`;overlay.querySelector('.close')?.focus();}
  document.addEventListener('click',e=>{const btn=e.target.closest('button');if(!btn)return;if(btn.dataset.view){nav(btn.dataset.view,btn.dataset.coffee);return}if(btn.dataset.lens){const y=window.scrollY;state.lens=btn.dataset.lens;render();window.scrollTo({top:y,behavior:'instant'});return}const a=btn.dataset.action;if(a==='search')showSearch();else if(a==='guide')showSearch(true);else if(a==='review')showReview();else if(a==='close')overlay.innerHTML='';else if(a==='submit-preview'){const el=overlay.querySelector('.status');if(el)el.innerHTML=`<strong>${state.rating} / 5 — preview captured locally.</strong> This interaction demonstrates the flow only. No review was submitted, saved, or counted.`;btn.textContent='Nothing submitted · close to continue';btn.disabled=true;}if(btn.dataset.filter){state.filter=btn.dataset.filter;overlay.querySelectorAll('[data-filter]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.filter===state.filter)));updateResults()}if(btn.dataset.rating){state.rating=Number(btn.dataset.rating);overlay.querySelectorAll('[data-rating]').forEach(b=>{const on=Number(b.dataset.rating)<=state.rating;b.classList.toggle('filled',on);b.setAttribute('aria-pressed',String(Number(b.dataset.rating)===state.rating))});document.getElementById('submit-preview').disabled=false;}});
  document.getElementById('search-btn').addEventListener('click',()=>showSearch());document.getElementById('home-btn').addEventListener('click',()=>nav('home'));document.getElementById('nav-home').addEventListener('click',()=>nav('home'));document.getElementById('nav-explore').addEventListener('click',()=>nav('explore'));document.getElementById('nav-learn').addEventListener('click',()=>nav('learn'));document.getElementById('nav-tools').addEventListener('click',()=>nav('tools'));document.getElementById('nav-my').addEventListener('click',()=>nav('my'));document.getElementById('nav-evidence').addEventListener('click',()=>nav('evidence'));document.getElementById('mode-btn').addEventListener('click',()=>{state.returning=!state.returning;render();});document.getElementById('about-prototype').addEventListener('click',about);
  document.addEventListener('input',e=>{if(e.target.id==='search-input'){state.search=e.target.value;updateResults();}});document.addEventListener('keydown',e=>{if(e.key==='Escape')overlay.innerHTML='';if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();showSearch()}});window.addEventListener('popstate',e=>{const p=new URLSearchParams(location.search);state.view=['home','coffee','estate','evidence','explore','learn','tools','my'].includes(p.get('view'))?p.get('view'):'home';state.coffee=coffees[p.get('coffee')]?p.get('coffee'):'baarbara';overlay.innerHTML='';render();});const p=new URLSearchParams(location.search);if(['home','coffee','estate','evidence','explore','learn','tools','my'].includes(p.get('view')))state.view=p.get('view');if(coffees[p.get('coffee')])state.coffee=p.get('coffee');render();
})();
</script></body></html>
